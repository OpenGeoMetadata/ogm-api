name: Nightly OGM Sync

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ogm-nightly-sync
  cancel-in-progress: false

jobs:
  trigger-nightly-sync:
    name: Harvest and Reindex Production
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out preflight script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.OGM_KAMAL_SSH_PRIVATE_KEY }}

      - name: Trust production host key
        env:
          SSH_HOST: ${{ secrets.OGM_KAMAL_SSH_HOST }}
          SSH_PORT: ${{ secrets.OGM_KAMAL_SSH_PORT || '22' }}
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Verify production disk reserve and Elasticsearch write readiness
        env:
          SSH_HOST: ${{ secrets.OGM_KAMAL_SSH_HOST }}
          SSH_PORT: ${{ secrets.OGM_KAMAL_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.OGM_KAMAL_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'python3 - --min-free-percent 15' < backend/scripts/check_ogm_sync_capacity.py

      - name: Refresh repositories, harvest, and verify indexing
        env:
          SSH_HOST: ${{ secrets.OGM_KAMAL_SSH_HOST }}
          SSH_PORT: ${{ secrets.OGM_KAMAL_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.OGM_KAMAL_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -eu

            container="$(docker ps \
              --filter label=service=ogm-api \
              --filter label=role=worker \
              --filter status=running \
              --format "{{.Names}}" \
              | head -n1)"

            if [ -z "$container" ]; then
              container="$(docker ps \
                --filter label=service=ogm-api \
                --filter label=role=web \
                --filter status=running \
                --format "{{.Names}}" \
                | head -n1)"
            fi

            if [ -z "$container" ]; then
              echo "No running ogm-api web or worker container found." >&2
              exit 1
            fi

            echo "Using container: $container"
            docker exec "$container" python /app/backend/scripts/trigger_ogm_nightly_sync.py --wait
          '
