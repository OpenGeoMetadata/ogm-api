# config/deploy.yml
service: ogm-api
image: ewlarson/opengeometadata-api

builder:
  arch: amd64

ssh:
  user: ewlarson

servers:
  web:
    hosts:
      - ogm.geo4lib.app
    cmd: bash -lc "cd /app/backend && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers=${WEB_UVICORN_WORKERS:-2} --log-level info"
  worker:
    hosts:
      - ogm.geo4lib.app
    cmd: bash -lc "cd /app/backend && exec celery -A app.tasks.worker worker -E --loglevel=INFO --concurrency=${CELERY_WORKER_CONCURRENCY:-2} --prefetch-multiplier=1"
  cron:
    hosts:
      - ogm.geo4lib.app
    cmd: bash -lc "/app/scripts/start_cron.sh"
    options:
      cpus: 0.25
      memory: 256m
      user: root

proxy:
  ssl: true
  host: ogm.geo4lib.app
  app_port: 8000
  healthcheck:
    path: /api/docs

registry:
  server: ghcr.io
  username: ewlarson
  password:
    - KAMAL_REGISTRY_PASSWORD

# ───────────────── ENV passed into *every* web container ────────────────
env:
  clear:
    ELASTICSEARCH_URL:     http://ogm-api-elasticsearch:9200
    ELASTICSEARCH_INDEX:   opengeometadata_api
    REDIS_HOST:            ogm-api-redis
    REDIS_PORT:            "6379"
    REDIS_DB:              "0"
    REDIS_TTL:             "604800"
    LOG_LEVEL:             DEBUG
    ENDPOINT_CACHE:        "true"
    GAZETTEER_CACHE_TTL:   "3600"
    RESOURCE_REPRESENTATION_DURABLE_STORE: database
    API_RESPONSE_DURABLE_CACHE_STORE: database
    VISUAL_ASSET_DURABLE_STORE: s3
    VISUAL_ASSET_CACHE_TTL_SECONDS: "86400"
    VISUAL_ASSET_REDIS_BODY_CACHE_ENABLED: "false"
    VISUAL_ASSET_S3_RETAIN_DATABASE_BODY: "false"
    VISUAL_ASSET_S3_ENDPOINT: https://96d9819fafc99210217fc4e9aac9c73d.eu.r2.cloudflarestorage.com
    VISUAL_ASSET_S3_REGION: auto
    VISUAL_ASSET_S3_BUCKET: ogm
    VISUAL_ASSET_S3_PREFIX: assets
    VISUAL_ASSET_PUBLIC_BASE_URL: https://assets.geo4lib.app
    STATIC_MAP_RENDERER_URL: http://ogm-api-map-renderer:8080
    STATIC_MAP_RENDER_REVISION: openfreemap-liberty-native-v1
    ENABLE_FAST_EMBEDDINGS: "false"
    ENABLE_APPSIGNAL:      "false"
    APP_MODE:              production
    APP_ENV:               production
    APPLICATION_URL:       https://ogm.geo4lib.app
    OPENGEOMETADATA_API_BASE_URL: https://ogm.geo4lib.app
    PYTHONPATH:            /app/backend
    PYTHON_BIN:            /usr/local/bin/python
    IS_DOCKER:             "true"
    CRON_LOCAL_TIMEZONE:   America/Chicago
    OGM_TRIGGER:           nightly
    OGM_NIGHTLY_CRON_ENABLED: "false"
    OGM_THUMBNAIL_REFRESH_ENABLED: "true"
    OGM_THUMBNAIL_REFRESH_BATCH_SIZE: "500"
    OGM_THUMBNAIL_REFRESH_CONCURRENCY: "2"
    PDF_THUMBNAIL_MAX_BYTES: "33554432"
    REMOTE_THUMBNAIL_MAX_BYTES: "20971520"
    RATE_LIMIT_ENABLED: "false"

  secret:
    - ADMIN_USERNAME
    - ADMIN_PASSWORD
    - DATABASE_URL
    - GITHUB_TOKEN
    - OPENAI_API_KEY
    - OPENAI_MODEL
    - POSTGRES_PASSWORD
    - OGM_WEBHOOK_SECRET
    - VISUAL_ASSET_S3_ACCESS_KEY_ID
    - VISUAL_ASSET_S3_SECRET_ACCESS_KEY

# ────────────── Accessories (one per Compose service) ──────────────
accessories:
  map-renderer:
    image: ghcr.io/ewlarson/ogm-maplibre-renderer:r2-20261026
    roles: [web]
    cmd: sh -c 'rm -f /tmp/.X99-lock /tmp/.X11-unix/X99; Xvfb :99 -screen 0 1280x1024x24 -ac -nolisten tcp & sleep 2; exec node server.mjs'
    env:
      clear:
        STATIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
    options:
      init: true
      memory: 1g
      cpus: 2
      log-opt: max-size=10m
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    roles: [web]
    env:
      clear:
        discovery.type: single-node
        xpack.security.enabled: "false"
        ES_JAVA_OPTS: "-Xms2g -Xmx2g"
        cluster.routing.allocation.disk.threshold_enabled: "true"
    # only listen on localhost
    port: "127.0.0.1:9200:9200"
    directories:
      # Keep this relative source name: Kamal resolves it to the existing
      # /home/ewlarson/ogm-api-elasticsearch/esdata production bind.
      - esdata:/usr/share/elasticsearch/data

  postgres:
    image: postgres:15
    roles: [web]
    env:
      clear:
        POSTGRES_USER: ogm_api_user
        POSTGRES_DB:   btaa_ogm_api
      secret:
        - POSTGRES_PASSWORD

    # only listen on localhost
    port: "127.0.0.1:5432:5432"
    files:
      - config/init.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      # Keep this relative source name: Kamal resolves it to the existing
      # /home/ewlarson/ogm-api-postgres/pgdata production bind.
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    roles: [web]
    cmd: sh -lc 'redis-server --appendonly yes --protected-mode yes --bind 0.0.0.0'
    directories:
      # Keep this relative source name: Kamal resolves it to the existing
      # /home/ewlarson/ogm-api-redis/redisdata production bind.
      - redisdata:/data
